name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-react/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app-react
      - name: Type check + build (tsc --noEmit && vite build)
        run: npm run build
        working-directory: app-react
